<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeltaLauncher - Achievements</title>
  <style>
    @font-face {
      font-family: 'Determination Mono';
      src: url('../determinationMono.ttf') format('truetype');
    }

    #grid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* BGM Notif */
    .now-playing {
      position: fixed;
      top: 30px;
      right: -500px;
      max-width: 200px;
      height: auto;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: right 0.6s cubic-bezier(0.39, 0.575, 0.565, 1),
                  opacity 0.6s cubic-bezier(0.39, 0.575, 0.565, 1);
    }

    .now-playing.show {
      right: 30px;
      opacity: 1;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Determination Mono', monospace, sans-serif;
      text-shadow: 2px 2px 0px #000000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Scaled Viewport Container */
    .shop-scaler {
      position: relative;
      width: 640px;
      height: 480px;
      transform-origin: center center;
      z-index: 10;
    }

    .shop-wrapper {
      width: 640px;
      height: 480px;
      position: relative;
      background: url('../assets/shop/background.png') no-repeat center center;
      background-size: 640px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      border: 4px solid #ffffff;
      image-rendering: pixelated;
      image-rendering: crisp-edges; 
      box-sizing: border-box;
    }

    .shopkeeper {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      height: 230px;
      width: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Bottom UI Layout */
    .ui-container {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      height: 200px;
      display: flex;
      gap: 10px;
    }

    /* Dialogue Box (Left) */
    .dialogue-box {
      flex: 1.8;
      background-color: #000000;
      border: 4px solid #ffffff;
      padding: 20px;
      box-sizing: border-box;
      font-size: 1.35rem;
      line-height: 1.6;
      color: #ffffff;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Menu Box (Right) */
    .menu-box {
      flex: 1;
      background-color: #000000;
      border: 4px solid #ffffff;
      padding: 20px 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-options {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      font-size: 1.35rem;
      color: #ffffff;
      cursor: pointer;
      display: block;
      text-transform: uppercase;
      user-select: none;
      transition: color 0.1s ease;
    }

    .menu-item:hover,
    .menu-item.active {
      color: #ffff00;
      text-shadow: 2px 2px 0px #3f3f00;
    }

    .currency-display {
      font-size: 1.35rem;
      color: #ffffff;
      text-align: right;
      padding-top: 10px;
      border-top: 2px dashed #444;
    }

    .controls-group {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .ctrl-btn {
      background-color: #000000;
      color: #888888;
      border: 2px solid #888888;
      padding: 8px 12px;
      font-family: 'Determination Mono', monospace, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 1px 1px 0px #000000;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .ctrl-btn.active {
      color: #55ff55;
      border-color: #55ff55;
    }
  </style>
</head>
<body>

  <canvas id="grid-canvas"></canvas>

  <div class="shop-scaler" id="shop-scaler">
    <div class="shop-wrapper">
      <img src="../assets/shop/seam.png" alt="Seam" class="shopkeeper">

      <div class="ui-container">
        <!-- Dialogue Box -->
        <div id="dialogue-box" class="dialogue-box"></div>

        <!-- Menu Options -->
        <div class="menu-box">
          <ul class="menu-options">
            <li class="menu-item" onclick="selectOption('buy')">Achievements</li>
            <li class="menu-item" onclick="selectOption('sell')">Sell</li>
            <li class="menu-item" onclick="selectOption('talk')">Talk</li>
            <li class="menu-item" onclick="selectOption('exit')">Exit</li>
          </ul>
          <div class="currency-display">0D$</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-group">
    <button id="vfx-toggle" class="ctrl-btn active">[ VFX: ON ]</button>
    <button id="music-toggle" class="ctrl-btn">[ MUSIC: OFF ]</button>
  </div>

  <audio id="bg-music" src="../assets/shop/mus_shop.ogg" loop></audio>
  <img id="now-playing" src="../assets/shopSplash.png" class="now-playing" alt="Now Playing">

  <script>
    const canvas = document.getElementById('grid-canvas');
    const ctx = canvas.getContext('2d');

    let vfxEnabled = true;
    let offsetX1 = 0, offsetY1 = 0;
    let offsetX2 = 0, offsetY2 = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      autoScaleShop();
    }

    function drawGridPattern(offsetX, offsetY, strokeStyle, lineWidth) {
      const cellSize = 60;
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;

      const startX = (offsetX % cellSize) - cellSize;
      const startY = (offsetY % cellSize) - cellSize;
      for (let x = startX; x < canvas.width + cellSize; x += cellSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = startY; y < canvas.height + cellSize; y += cellSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (vfxEnabled) {
        offsetX1 -= 0.8;
        offsetY1 -= 0.8;
        offsetX2 += 0.4;
        offsetY2 += 0.4;
        drawGridPattern(offsetX2, offsetY2, 'rgba(160, 0, 160, 0.35)', 1);
        drawGridPattern(offsetX1, offsetY1, 'rgba(255, 0, 255, 0.75)', 1.5);
      } else {
        drawGridPattern(0, 0, 'rgba(255, 0, 255, 0.4)', 1);
      }

      requestAnimationFrame(render);
    }
    render();

    const scaler = document.getElementById('shop-scaler');
    function autoScaleShop() {
      const padding = 20;
      const scaleX = (window.innerWidth - padding) / 640;
      const scaleY = (window.innerHeight - padding) / 480;
      const scale = Math.min(scaleX, scaleY, 1.8);
      scaler.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const dialogueBox = document.getElementById('dialogue-box');
    const moveSound = new Audio('../assets/sounds/snd_menumove.wav');
    const selectSound = new Audio('../assets/sounds/snd_select.wav');
    
    const voiceSound = new Audio('../assets/sounds/snd_text.wav');
    voiceSound.addEventListener('error', () => {
      voiceSound.src = '../assets/sounds/snd_noise.wav';
    });

    let currentTimeout = null;

    // Typewriter Functionality
    function typeWriter(text, speed = 35) {
      clearTimeout(currentTimeout);
      dialogueBox.textContent = '';
      let i = 0;

      function type() {
        if (i < text.length) {
          const char = text.charAt(i);
          dialogueBox.textContent += char;

          if (char !== ' ' && char !== '\n') {
            const soundClone = voiceSound.cloneNode();
            soundClone.volume = 0.5;
            soundClone.play().catch(() => {});
          }

          i++;
          currentTimeout = setTimeout(type, speed);
        }
      }

      type();
    }

    // Menu Options
    function selectOption(action) {
      selectSound.currentTime = 0;
      selectSound.play().catch(() => {});

      switch (action) {
        case 'buy':
          typeWriter("* I don't have any \n  achievements yet.\n\n* Check back later.");
          break;
        case 'sell':
          typeWriter("* I have no need for your odds and ends.");
          break;
        case 'talk':
          typeWriter("* What do you want to talk \n  about?\n* There is nothing.");
          break;
        case 'exit':
          typeWriter("* Farewell, traveler.");
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 1800);
          break;
      }
    }

    const menuItems = document.querySelectorAll('.menu-item');
    menuItems.forEach(item => {
      item.addEventListener('mouseenter', () => {
        moveSound.currentTime = 0;
        moveSound.play().catch(() => {});
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      typeWriter("* Hee hee...\n* Welcome, traveller.");
    });

    // Control buttons setup
    const vfxBtn = document.getElementById('vfx-toggle');
    vfxBtn.addEventListener('click', () => {
      vfxEnabled = !vfxEnabled;
      vfxBtn.textContent = vfxEnabled ? '[ VFX: ON ]' : '[ VFX: OFF ]';
      vfxBtn.classList.toggle('active', vfxEnabled);
    });

    const audio = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');
    const nowPlaying = document.getElementById('now-playing');
    let splashTimeout;

    audio.volume = 0.75;

    musicBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          musicBtn.textContent = '[ MUSIC: ON ]';
          musicBtn.classList.add('active');
          nowPlaying.classList.add('show');
          clearTimeout(splashTimeout);
          splashTimeout = setTimeout(() => {
            nowPlaying.classList.remove('show');
          }, 3000);
        }).catch(err => console.error("Audio error:", err));
      } else {
        audio.pause();
        musicBtn.textContent = '[ MUSIC: OFF ]';
        musicBtn.classList.remove('active');
        nowPlaying.classList.remove('show');
      }
    });
  </script>

</body>
</html>
