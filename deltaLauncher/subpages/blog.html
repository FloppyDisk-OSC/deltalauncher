      font-family: 'Determination Mono';

    #grid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* BGM Notif */
    .now-playing {
      position: fixed;
      top: 30px;
      right: -500px;
      max-width: 200px;
      height: auto;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: right 0.6s cubic-bezier(0.39, 0.575, 0.565, 1),

    }

    .now-playing.show {
      right: 30px;
      opacity: 1;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Determination Mono', monospace, sans-serif;

      margin: 0;

      box-sizing: border-box;
      min-height: 100vh;

    .container {

      position: relative;
    }

    .blog-header {

      margin-bottom: 50px;
    }

      margin: 0 auto;
      width: 160px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .blog-layout {
      display: grid;
      grid-template-columns: 1fr 280px;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawGridPattern(offsetX, offsetY, strokeStyle, lineWidth) {
      const cellSize = 60;
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;

      const startX = (offsetX % cellSize) - cellSize;
      const startY = (offsetY % cellSize) - cellSize;
      for (let x = startX; x < canvas.width + cellSize; x += cellSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = startY; y < canvas.height + cellSize; y += cellSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (vfxEnabled) {
        offsetX1 -= 0.8;
        offsetY1 -= 0.8;
        offsetX2 += 0.4;
        offsetY2 += 0.4;
        drawGridPattern(offsetX2, offsetY2, 'rgba(160, 0, 160, 0.35)', 1);
        drawGridPattern(offsetX1, offsetY1, 'rgba(255, 0, 255, 0.75)', 1.5);
      } else {
        drawGridPattern(0, 0, 'rgba(255, 0, 255, 0.4)', 1);
      }

      requestAnimationFrame(render);
    }

    const nowPlaying = document.getElementById('now-playing');
    let splashTimeout;

    musicBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          musicBtn.textContent = '[ MUSIC: ON ]';
          musicBtn.classList.add('active');
          nowPlaying.classList.add('show');
          clearTimeout(splashTimeout);
          splashTimeout = setTimeout(() => {
            nowPlaying.classList.remove('show');
          }, 3000);
        }).catch(err => console.error("audio error:", err));
      } else {
        audio.pause();
        musicBtn.textContent = '[ MUSIC: OFF ]';
        musicBtn.classList.remove('active');
