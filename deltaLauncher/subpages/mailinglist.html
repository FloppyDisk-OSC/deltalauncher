<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../cursor.js"></script>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeltaLauncher - Mailing List</title>
  <style>
    @font-face {
      font-family: 'Determination Mono';
      src: url('../determinationMono.ttf') format('truetype');
    }

    #grid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* BGM Notif */
    .now-playing {
      position: fixed;
      top: 30px;
      right: -500px;
      max-width: 200px;
      height: auto;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: right 0.6s cubic-bezier(0.39, 0.575, 0.565, 1),
                  opacity 0.6s cubic-bezier(0.39, 0.575, 0.565, 1);
    }

    .now-playing.show {
      right: 30px;
      opacity: 1;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Determination Mono', monospace, sans-serif;
      text-shadow: 1px 1px 0px #121032;
      margin: 0;
      padding: 50px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
      max-width: 650px;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .notice {
      line-height: 1.5;
      font-size: 1.05rem;
      margin-bottom: 30px;
      color: #dddddd;
    }

    .form-container {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      border: 4px solid #ffffff;
      padding: 30px 25px;
      box-sizing: border-box;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .input-label {
      font-size: 1.1rem;
      color: #ffff00;
      margin-bottom: 5px;
    }

    .text-input {
      background-color: #000000;
      border: 3px solid #ffffff;
      color: #ffffff;
      font-family: 'Determination Mono', monospace, sans-serif;
      font-size: 1.1rem;
      padding: 12px 15px;
      outline: none;
      box-sizing: border-box;
      width: 100%;
    }

    .text-input:focus {
      border-color: #ffff00;
    }

    .btn {
      background-color: #000000;
      color: #ffffff;
      border: 4px solid #ffffff;
      padding: 16px 24px;
      font-family: 'Determination Mono', monospace, sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 0.2s, color 0.2s;
      box-sizing: border-box;
      text-shadow: 2px 2px 0px #000000;
      text-align: center;
    }

    .btn:hover {
      background-color: #ffffff;
      color: #25262c;
      text-shadow: none;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #55ff55;
      text-align: center;
      display: none;
    }

    .back-nav {
      width: 100%;
    }

    .controls-group {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .ctrl-btn {
      background-color: #000000;
      color: #888888;
      border: 2px solid #888888;
      padding: 8px 12px;
      font-family: 'Determination Mono', monospace, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 1px 1px 0px #000000;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .ctrl-btn.active {
      color: #55ff55;
      border-color: #55ff55;
    }
  </style>
</head>
<body>

  <canvas id="grid-canvas"></canvas>

  <div class="container">
    <h1>MAILING LIST</h1>

    <div class="notice">
      * Join the list to get notified when new updates or games drop.<br>
      * We won't send you spam. Mostly because we don't know how.
    </div>

    <form id="subscribe-form" class="form-container" onsubmit="handleFormSubmit(event)">
      <label class="input-label" for="user-email">* Enter your email address:</label>
      <input type="email" id="user-email" class="text-input" placeholder="you@example.com" required>
      
      <button type="submit" class="btn">JOIN THE LIST</button>
      
      <div id="status-msg" class="status-msg">* WELCOME. TO THE MAILING LIST.</div>
    </form>

    <div class="back-nav">
      <a href="../index.html" class="btn" style="display: block;">[ RETURN TO HOME ]</a>
    </div>
  </div>

  <div class="controls-group">
    <button id="vfx-toggle" class="ctrl-btn active">[ VFX: ON ]</button>
    <button id="music-toggle" class="ctrl-btn">[ MUSIC: OFF ]</button>
  </div>

  <audio id="bg-music" src="../assets/music/mus_launcher.ogg" loop></audio>
  <img id="now-playing" src="../assets/musicsplash.png" class="now-playing" alt="Now Playing">

  <script>
    const canvas = document.getElementById('grid-canvas');
    const ctx = canvas.getContext('2d');

    let vfxEnabled = true;
    let offsetX1 = 0, offsetY1 = 0;
    let offsetX2 = 0, offsetY2 = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawGridPattern(offsetX, offsetY, strokeStyle, lineWidth) {
      const cellSize = 60;
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;

      const startX = (offsetX % cellSize) - cellSize;
      const startY = (offsetY % cellSize) - cellSize;
      for (let x = startX; x < canvas.width + cellSize; x += cellSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = startY; y < canvas.height + cellSize; y += cellSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (vfxEnabled) {
        offsetX1 -= 0.8;
        offsetY1 -= 0.8;
        offsetX2 += 0.4;
        offsetY2 += 0.4;
        drawGridPattern(offsetX2, offsetY2, 'rgba(160, 0, 160, 0.35)', 1);
        drawGridPattern(offsetX1, offsetY1, 'rgba(255, 0, 255, 0.75)', 1.5);
      } else {
        drawGridPattern(0, 0, 'rgba(255, 0, 255, 0.4)', 1);
      }

      requestAnimationFrame(render);
    }
    render();

    // Sound FX setup
    const moveSound = new Audio('../assets/sounds/snd_menumove.wav');
    const selectSound = new Audio('../assets/sounds/snd_select.wav');
    const typeSound = new Audio('../assets/sounds/snd_noise.wav');

    const interactiveElements = document.querySelectorAll('.btn, .text-input');
    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        moveSound.currentTime = 0;
        moveSound.play().catch(() => {});
      });
      el.addEventListener('click', () => {
        selectSound.currentTime = 0;
        selectSound.play().catch(() => {});
      });
    });

    // Play snd_noise on typing in the email field
    const emailInput = document.getElementById('user-email');
    emailInput.addEventListener('keydown', (e) => {
      // Ignore modifier key presses like Shift, Ctrl, Alt
      if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete') {
        typeSound.currentTime = 0;
        typeSound.play().catch(() => {});
      }
    });

    function handleFormSubmit(event) {
      event.preventDefault();
      selectSound.currentTime = 0;
      selectSound.play().catch(() => {});

      const statusMsg = document.getElementById('status-msg');
      statusMsg.style.display = 'block';
      emailInput.value = '';
    }

    // Controls setup
    const vfxBtn = document.getElementById('vfx-toggle');
    vfxBtn.addEventListener('click', () => {
      vfxEnabled = !vfxEnabled;
      vfxBtn.textContent = vfxEnabled ? '[ VFX: ON ]' : '[ VFX: OFF ]';
      vfxBtn.classList.toggle('active', vfxEnabled);
    });

    const audio = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');
    const nowPlaying = document.getElementById('now-playing');
    let splashTimeout;

    audio.volume = 0.75;

    musicBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          musicBtn.textContent = '[ MUSIC: ON ]';
          musicBtn.classList.add('active');
          nowPlaying.classList.add('show');
          clearTimeout(splashTimeout);
          splashTimeout = setTimeout(() => {
            nowPlaying.classList.remove('show');
          }, 3000);
        }).catch(err => console.error("audio error:", err));
      } else {
        audio.pause();
        musicBtn.textContent = '[ MUSIC: OFF ]';
        musicBtn.classList.remove('active');
        nowPlaying.classList.remove('show');
      }
    });
  </script>

</body>
</html>
