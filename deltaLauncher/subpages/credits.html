<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeltaLauncher - Credits</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <style>
    @font-face {
      font-family: 'Determination Mono';
      src: url('../determinationMono.ttf') format('truetype');
    }

    #grid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Determination Mono', monospace, sans-serif;
      text-shadow: 1px 1px 0px #000000;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 650px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffff00;
      margin-bottom: 40px;
      font-weight: normal;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px #3f3f00;
    }

    .credits-box {
      width: 100%;
      border: 4px solid #ffffff;
      background-color: rgba(0, 0, 0, 0.85);
      padding: 30px;
      box-sizing: border-box;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .credit-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .role {
      color: #8cb5ff;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .name {
      font-size: 1.4rem;
      font-weight: normal;
      color: #ffffff;
    }

    .subtext {
      font-size: 0.85rem;
      color: #aaaaaa;
    }

    .divider {
      width: 80%;
      height: 2px;
      background-color: #ffffff;
      margin: 5px auto;
      opacity: 0.3;
    }

    .btn-back {
      background-color: #000000;
      color: #ffffff;
      border: 4px solid #ffffff;
      padding: 14px 28px;
      font-family: 'Determination Mono', monospace, sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 0.2s, color 0.2s;
      box-sizing: border-box;
      text-shadow: 2px 2px 0px #000000;
    }

    .btn-back:hover {
      background-color: #ffffff;
      color: #25262c;
      text-shadow: none;
    }

    .controls-group {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .ctrl-btn {
      background-color: #000000;
      color: #888888;
      border: 2px solid #888888;
      padding: 8px 12px;
      font-family: 'Determination Mono', monospace, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 1px 1px 0px #000000;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .ctrl-btn.active {
      color: #55ff55;
      border-color: #55ff55;
    }

    .now-playing {
      position: fixed;
      top: 30px;
      right: -500px;
      max-width: 200px;
      height: auto;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: right 0.6s cubic-bezier(0.39, 0.575, 0.565, 1),
                  opacity 0.6s cubic-bezier(0.39, 0.575, 0.565, 1);
    }

    .now-playing.show {
      right: 30px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <canvas id="grid-canvas"></canvas>

  <div class="container">
    <h1>- CREDITS -</h1>

    <div class="credits-box">
      <div class="credit-section">
        <span class="role">MAIN DEVELOPER</span>
        <span class="name">ElectricFuzzball</span>
      </div>

      <div class="divider"></div>

      <div class="credit-section">
        <span class="role">INSPIRED BY</span>
        <span class="name">UNDERTALE & DELTARUNE</span>
        <span class="subtext">Created by Toby Fox & Team</span>
      </div>
      <div class="divider"></div>

      <div class="credit-section">
        <span class="role">FRIENDS</span>
        <span class="name">Rimasols</span>
        <span class="name">Gen1x / G1nx</span>
        <span class="name">Zee</span>
        <span class="subtext">Friends who helped me or just listened to me ramble</span>
      </div>

      <div class="divider"></div>

      <div class="credit-section">
        <span class="role">SPECIAL THANKS</span>
        <span class="name">The Community</span>
        <span class="subtext">And anyone playing games hosted here!</span>
      </div>
    </div>

    <a href="../index.html" class="btn-back">RETURN HOME</a>
  </div>

  <div class="controls-group">
    <button id="vfx-toggle" class="ctrl-btn active">[ VFX: ON ]</button>
    <button id="music-toggle" class="ctrl-btn">[ MUSIC: OFF ]</button>
  </div>

  <audio id="bg-music" src="../assets/music/mus_launcher.ogg" loop></audio>
  <img id="now-playing" src="../assets/musicsplash.png" class="now-playing" alt="Now Playing">

  <script>
    // Real-Time Canvas Background
    const canvas = document.getElementById('grid-canvas');
    const ctx = canvas.getContext('2d');

    let vfxEnabled = true;
    let offsetX1 = 0, offsetY1 = 0;
    let offsetX2 = 0, offsetY2 = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawGridPattern(offsetX, offsetY, strokeStyle, lineWidth) {
      const cellSize = 60;
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;

      const startX = (offsetX % cellSize) - cellSize;
      const startY = (offsetY % cellSize) - cellSize;

      for (let x = startX; x < canvas.width + cellSize; x += cellSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = startY; y < canvas.height + cellSize; y += cellSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (vfxEnabled) {
        offsetX1 -= 0.8;
        offsetY1 -= 0.8;
        offsetX2 += 0.4;
        offsetY2 += 0.4;

        drawGridPattern(offsetX2, offsetY2, 'rgba(160, 0, 160, 0.35)', 1);
        drawGridPattern(offsetX1, offsetY1, 'rgba(255, 0, 255, 0.75)', 1.5);
      } else {
        drawGridPattern(0, 0, 'rgba(255, 0, 255, 0.4)', 1);
      }

      requestAnimationFrame(render);
    }
    render();

    // Sound FX Initialization
    const moveSound = new Audio('../assets/sounds/snd_menumove.wav');
    const selectSound = new Audio('../assets/sounds/snd_select.wav');

    const backBtn = document.querySelector('.btn-back');
    backBtn.addEventListener('mouseenter', () => {
      moveSound.currentTime = 0;
      moveSound.play().catch(() => {});
    });
    backBtn.addEventListener('click', () => {
      selectSound.currentTime = 0;
      selectSound.play().catch(() => {});
    });

    // Controls Logic
    const vfxBtn = document.getElementById('vfx-toggle');
    vfxBtn.addEventListener('click', () => {
      vfxEnabled = !vfxEnabled;
      vfxBtn.textContent = vfxEnabled ? '[ VFX: ON ]' : '[ VFX: OFF ]';
      vfxBtn.classList.toggle('active', vfxEnabled);
    });

    const audio = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');
    const nowPlaying = document.getElementById('now-playing');
    let splashTimeout;

    audio.volume = 0.75;

    musicBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          musicBtn.textContent = '[ MUSIC: ON ]';
          musicBtn.classList.add('active');
          nowPlaying.classList.add('show');
          clearTimeout(splashTimeout);
          splashTimeout = setTimeout(() => {
            nowPlaying.classList.remove('show');
          }, 3000);
        }).catch(err => console.error("Audio error:", err));
      } else {
        audio.pause();
        musicBtn.textContent = '[ MUSIC: OFF ]';
        musicBtn.classList.remove('active');
        nowPlaying.classList.remove('show');
      }
    });
  </script>

</body>
</html>
